name: Run migrations for database

on: 
  workflow_dispatch:

jobs:
  run-migrations:
    runs-on: ubuntu-latest
    steps: 
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with: 
        role-to-assume: arn:aws:iam::000363030077:role/core-infra-github-role
        aws-region: us-east-1
    
    - name: Retrieve DB secrets
      id: secrets
      run: |
        DB_SECRET=$(aws secretsmanager get-secret-value --secret-id db-credentials --query SecretString --output text)
        echo "DB_SECRET=$DB_SECRET" >> $GITHUB_ENV

    - name: Run migrations
      run: alembic upgrade head
      env:
        DB_HOST: ${{ fromJSON(env.DB_SECRET)["host"] }}
        DB_USERNAME: ${{ fromJSON(env.DB_SECRET)["username"]  }}
        DB_PASSWORD: ${{ fromJSON(env.DB_SECRET)["password"]  }}
        DB_NAME: ${{ fromJSON(env.DB_SECRET)["db_name"]  }}
