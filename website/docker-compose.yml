services:
  web:
    build: .
    ports:
      - "5000:80"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
  db: 
    image: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
